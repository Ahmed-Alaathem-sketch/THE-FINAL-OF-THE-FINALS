# Cloudflare deployment (Free plan): a static single-page app served as Workers static assets.
# No Worker script, no D1, no R2, no KV, no secrets: all data stays in the visitor's browser (IndexedDB).
# `npx wrangler deploy` runs the build below, then uploads ./dist.
name = "the-final-of-the-finals"
compatibility_date = "2026-11-01"

[build]
command = "npm ci && npm run build"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
